baseURL: https://linyutian.github.io/
locale: en-US
title: Yutian Lin
enableRobotsTXT: true
enableGitInfo: false

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

# Post folders publish only what templates actually use (resized WebP, cover), not the raw originals.
cascade:
  - build:
      publishResources: false
    target:
      path: /posts/**

# Only tags at launch. To add multi-part series later, add `series: series` here.
taxonomies:
  tag: tags

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home: [HTML, RSS, JSON] # JSON powers PaperMod's search page

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          inline: # single $ deliberately NOT a delimiter, so prices like "$5 vs $10" stay text
            - ['\(', '\)']
          block:
            - ['\[', '\]']
            - ['$$', '$$']
    renderer:
      unsafe: false
  highlight:
    noClasses: false # emit CSS classes; colors come from assets/css/extended/chroma.css
    codeFences: true
    guessSyntax: false
    lineNos: false

imaging:
  webp:
    quality: 82
  jpeg:
    quality: 82
  resampleFilter: Lanczos

# Nav menu hidden while there are only a few posts: the home page already lists every post.
# To bring it back, uncomment. The /posts/, /tags/ and /search/ pages are still built either way.
# menu:
#   main:
#     - name: Posts
#       url: /posts/
#       weight: 10
#     - name: Tags
#       url: /tags/
#       weight: 20
#     - name: Search
#       url: /search/
#       weight: 30

params:
  env: production
  description: "Notes on AI/ML infrastructure — technical depth and business intuition."
  author: Yutian Lin
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowRssButtonInSectionTermList: false
  ShowShareButtons: false
  ShowWordCount: false
  disableSpecial1stPost: true

  homeInfoParams:
    Title: "Hi, I'm Yutian"
    Content: |
      I document my learning and thinking about AI, ML infra, and sometimes math here. Every post tries to take two angles: the technical depth to understand how things work, and the business intuition to know when it matters.

      I studied math and CS at Columbia University, focusing on algebra and complexity theory. I've built AI, data, and platform products for clients. I'm especially interested in developer-facing B2B products :)

      I appreciate your read. Please reach out for comments and feedback: tinalin [at] mit [dot] edu

  socialIcons:
    - name: linkedin
      url: https://www.linkedin.com/in/yutian-lin
    - name: x
      url: https://x.com/yutian_tinalin

  assets:
    disableHLJS: true # use Hugo's Chroma, not highlight.js

  goatcounter: linyutian

  fuseOpts:
    keys: [title, permalink, summary, content]
