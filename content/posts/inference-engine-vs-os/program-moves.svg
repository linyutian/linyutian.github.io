<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="230" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <text x="180" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0a3069" letter-spacing="1">CLASSIC SYSTEM</text>
  <text x="540" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#762c00" letter-spacing="1">LLM INFERENCE</text>
  <line x1="360" y1="20" x2="360" y2="215" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Classic: data streams through a resident program -->
  <text x="75" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a">data records</text>
  <line x1="30" y1="120" x2="132" y2="120" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/>
  <rect x="138" y="88" width="90" height="64" rx="6" fill="#dbe9ff" stroke="#0969da" stroke-width="2"/>
  <text x="183" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#0a3069">program</text>
  <text x="183" y="136" text-anchor="middle" font-size="12" fill="#0a3069">resident</text>
  <line x1="234" y1="120" x2="335" y2="120" stroke="#0969da" stroke-width="3" marker-end="url(#ab)"/>
  <text x="180" y="200" text-anchor="middle" font-size="14" fill="#1f2328">data streams through the program</text>

  <!-- LLM: program streams into compute every token -->
  <rect x="380" y="78" width="110" height="84" rx="6" fill="#ffe8cc" stroke="#bc4c00" stroke-width="2"/>
  <text x="435" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#762c00">weights</text>
  <text x="435" y="132" text-anchor="middle" font-size="12" fill="#762c00">~140 GB in HBM</text>
  <line x1="496" y1="110" x2="569" y2="110" stroke="#bc4c00" stroke-width="3" marker-end="url(#ao)"/>
  <line x1="496" y1="130" x2="569" y2="130" stroke="#bc4c00" stroke-width="3" marker-end="url(#ao)"/>
  <text x="532" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#762c00">every token</text>
  <rect x="575" y="88" width="130" height="64" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="640" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#57606a">compute</text>
  <text x="640" y="133" text-anchor="middle" font-size="12" fill="#57606a">token vector, ~16 KB</text>
  <text x="540" y="200" text-anchor="middle" font-size="14" fill="#1f2328">the program streams through, once per token</text>
</svg>
