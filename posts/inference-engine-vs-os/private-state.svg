<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="230" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>
  <text x="180" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0a3069" letter-spacing="1">CLASSIC SYSTEM</text>
  <text x="540" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#762c00" letter-spacing="1">LLM INFERENCE</text>
  <line x1="360" y1="20" x2="360" y2="215" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Classic: many queries, one shared state -->
  <text x="62" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a">queries</text>
  <line x1="95" y1="80" x2="165" y2="105" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="95" y1="120" x2="165" y2="120" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="95" y1="160" x2="165" y2="135" stroke="#0969da" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="172" y="80" width="150" height="80" rx="6" fill="#dbe9ff" stroke="#0969da" stroke-width="2"/>
  <text x="247" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#0a3069">shared tables</text>
  <text x="247" y="134" text-anchor="middle" font-size="12" fill="#0a3069">large · persistent</text>
  <text x="180" y="200" text-anchor="middle" font-size="14" fill="#1f2328">one state, shared by all queries</text>

  <!-- LLM: one growing KV cache per request -->
  <text x="385" y="90" font-size="13" fill="#57606a">req A</text>
  <rect x="440" y="76" width="80" height="20" rx="3" fill="#ffe8cc" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="520" y="76" width="50" height="20" rx="3" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="385" y="125" font-size="13" fill="#57606a">req B</text>
  <rect x="440" y="111" width="150" height="20" rx="3" fill="#ffe8cc" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="590" y="111" width="50" height="20" rx="3" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="385" y="160" font-size="13" fill="#57606a">req C</text>
  <rect x="440" y="146" width="40" height="20" rx="3" fill="#ffe8cc" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="480" y="146" width="50" height="20" rx="3" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="540" y="200" text-anchor="middle" font-size="14" fill="#1f2328">a private KV cache per request, growing</text>
</svg>
